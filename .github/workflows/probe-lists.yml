name: probe-lists
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/fetch_esg_lists.py", ".github/workflows/probe-lists.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pypdf
      - run: python tools/fetch_esg_lists.py 2>&1
