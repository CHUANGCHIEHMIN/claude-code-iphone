name: probe-news
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/probe_news.py", "screener/news_ratings.py", ".github/workflows/probe-news.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe_news.py
